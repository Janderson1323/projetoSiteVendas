<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <title th:text="${produto.nome + ' | Elegance'}">
        Produto | Elegance
    </title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <link rel="stylesheet"
          th:href="@{/css/elegance.css}">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark">

    <div class="container">

        <a class="navbar-brand" href="/">
            ELEGANCE
        </a>

        <div class="d-flex gap-3">

            <a href="/catalogo"
               class="btn btn-outline-claro">
                <i class="bi bi-arrow-left"></i>
                Catálogo
            </a>

            <a href="/carrinho"
               class="btn btn-carrinho">
                <i class="bi bi-bag"></i>
                Carrinho
            </a>

        </div>

    </div>

</nav>


<main class="produto-detalhe">

    <div class="container">

        <div class="row g-5 align-items-start">

			<div class="col-lg-7">

			    <div class="produto-galeria">

			        <!-- MINIATURAS -->
			        <div class="produto-miniaturas">

			            <!-- IMAGEM PRINCIPAL -->
						<!-- IMAGEM PRINCIPAL -->
						<button type="button"
						        class="miniatura ativa"
						        th:if="${produto.imagemUrl != null and !produto.imagemUrl.isEmpty()}"
						        th:attr="data-img=${produto.imagemUrl}">
						    <img th:src="${produto.imagemUrl}"
						         th:alt="${produto.nome}">
						</button>
						
						<!-- IMAGENS ADICIONAIS -->
						<button type="button"
						        class="miniatura"
						        th:each="imagem, iterStat : ${produto.imagens}"
						        th:classappend="${(produto.imagemUrl == null or produto.imagemUrl.isEmpty()) and iterStat.first} ? ' ativa' : ''"
						        th:attr="data-img=${imagem}">
						    <img th:src="${imagem}"
						         th:alt="${produto.nome}">
						</button>

			        </div>


					<!-- IMAGEM GRANDE -->
					<div class="produto-detalhe-imagem">

					    <img id="imagemPrincipal"
					         th:src="${
					             produto.imagemUrl != null and !produto.imagemUrl.isEmpty()
					             ? produto.imagemUrl
					             : (
					                 produto.imagens != null and !produto.imagens.isEmpty()
					                 ? produto.imagens[0]
					                 : '/img/sem-imagem.png'
					             )
					         }"
					         th:alt="${produto.nome}">

					    <span class="produto-selo"
					          th:if="${produto.estoque > 0}">
					        Disponível
					    </span>

					    <span class="produto-selo produto-selo-esgotado"
					          th:if="${produto.estoque <= 0}">
					        Indisponível
					    </span>

					</div>

			    </div>

			</div>


            <div class="col-lg-5">

                <div class="produto-detalhe-conteudo">

                    <span class="produto-categoria">
                        Seleção Elegance
                    </span>

                    <h1 th:text="${produto.nome}">
                        Nome do produto
                    </h1>


                    <div class="produto-detalhe-preco">

                        <span>A partir de</span>

                        <strong>
                            R$
                            <span class="valor"
                                  th:text="${#numbers.formatDecimal(
                                      produto.preco,
                                      1,
                                      'POINT',
                                      2,
                                      'COMMA'
                                  )}">
                                0,00
                            </span>
                        </strong>

                    </div>


                    <p class="produto-detalhe-descricao"
                       th:text="${produto.descricao}">
                        Descrição do produto
                    </p>


                    <div class="produto-detalhe-estoque">

                        <i class="bi bi-box-seam"></i>

                        <span th:if="${produto.estoque > 0}">
                            <strong th:text="${produto.estoque}">
                                0
                            </strong>
                            unidades disponíveis
                        </span>

                        <span th:if="${produto.estoque <= 0}">
                            Produto indisponível
                        </span>

                    </div>


                    <form th:action="@{/carrinho/adicionar/{id}(id=${produto.id})}"
                          method="post"
                          class="produto-compra">

                        <label for="quantidade">
                            Quantidade
                        </label>

                        <input type="number"
                               id="quantidade"
                               name="quantidade"
                               value="1"
                               min="1"
                               th:max="${produto.estoque}"
                               th:disabled="${produto.estoque <= 0}">

                        <button type="submit"
                                class="btn-adicionar-produto"
                                th:disabled="${produto.estoque <= 0}">

                            <i class="bi bi-bag-plus"></i>

                            <span th:if="${produto.estoque > 0}">
                                Adicionar ao carrinho
                            </span>

                            <span th:if="${produto.estoque <= 0}">
                                Produto indisponível
                            </span>

                        </button>

                    </form>


                    <a th:href="'https://wa.me/5511954307383?text=Olá,%20tenho%20interesse%20no%20produto%20' + ${produto.nome}"
                       target="_blank"
                       rel="noopener noreferrer"
                       class="produto-whatsapp">

                        <i class="bi bi-whatsapp"></i>

                        Falar sobre este produto

                    </a>


                    <div class="produto-detalhe-beneficios">

                        <div>
                            <i class="bi bi-shield-check"></i>
                            <span>Compra segura</span>
                        </div>

                        <div>
                            <i class="bi bi-truck"></i>
                            <span>Consulte opções de entrega</span>
                        </div>

                        <div>
                            <i class="bi bi-chat-dots"></i>
                            <span>Atendimento pelo WhatsApp</span>
                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</main>


<a href="https://wa.me/5511954307383"
   target="_blank"
   rel="noopener noreferrer"
   class="whatsapp-flutuante"
   aria-label="Falar pelo WhatsApp">

    <i class="bi bi-whatsapp"></i>

</a>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
    const miniaturas =
        document.querySelectorAll(".miniatura");

    const imagemPrincipal =
        document.getElementById("imagemPrincipal");

    miniaturas.forEach(miniatura => {

        miniatura.addEventListener("click", () => {

            const novaImagem =
                miniatura.dataset.img;

            imagemPrincipal.src =
                novaImagem;

            miniaturas.forEach(item => {
                item.classList.remove("ativa");
            });

            miniatura.classList.add("ativa");
        });
    });
</script>


</body>
</html>
