<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Cadastrar / Editar Produto</title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body class="bg-light">

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-9 col-lg-7">

            <div class="card shadow-sm">

                <div class="card-header bg-primary text-white">

                    <h3 class="mb-0">
                        Cadastrar / Editar Produto
                    </h3>

                </div>


                <div class="card-body">

					<form th:action="@{/admin/produtos/salvar}"
					      th:object="${produto}"
					      method="post"
					      enctype="multipart/form-data">

                        <!-- ID -->
                        <input type="hidden"
                               th:field="*{id}">


                        <!-- NOME -->
                        <div class="mb-3">

                            <label class="form-label">
                                Nome
                            </label>

                            <input type="text"
                                   th:field="*{nome}"
                                   class="form-control"
                                   required>

                        </div>


                        <!-- DESCRIÇÃO -->
                        <div class="mb-3">

                            <label class="form-label">
                                Descrição
                            </label>

                            <textarea th:field="*{descricao}"
                                      class="form-control"
                                      rows="4">
                            </textarea>

                        </div>


                        <!-- PREÇO -->
                        <div class="mb-3">

                            <label class="form-label">
                                Preço
                            </label>

                            <input type="number"
                                   step="0.01"
                                   min="0"
                                   th:field="*{preco}"
                                   class="form-control"
                                   required>

                        </div>


                        <!-- ESTOQUE -->
                        <div class="mb-3">

                            <label class="form-label">
                                Estoque
                            </label>

                            <input type="number"
                                   min="0"
                                   th:field="*{estoque}"
                                   class="form-control"
                                   required>

                        </div>


                        <hr class="my-4">


                        <!-- IMAGEM PRINCIPAL -->
						<!-- IMAGENS DO PRODUTO -->

						<h5 class="mb-3">
						    Imagens do produto
						</h5>

						<!-- IMAGEM PRINCIPAL ATUAL -->
						<div class="mb-3">

						    <label class="form-label">
						        Imagem principal atual
						    </label>

						    <input type="text"
						           class="form-control"
						           th:field="*{imagemUrl}"
						           readonly>

						</div>

						<!-- UPLOAD NOVA IMAGEM PRINCIPAL -->
						<div class="mb-3">

						    <label class="form-label">
						        Escolher nova imagem principal
						    </label>

						    <input type="file"
						           name="imagemPrincipalArquivo"
						           class="form-control"
						           accept="image/*">

						    <div class="form-text">
						        Se você não escolher uma nova imagem, a atual será mantida.
						    </div>

						</div>

						<!-- IMAGENS ADICIONAIS ATUAIS -->
						<div class="mb-3">

						    <label class="form-label">
						        Imagens adicionais atuais
						    </label>

						    <div th:if="${produto.imagens != null and !produto.imagens.isEmpty()}">

						        <div th:each="imagem : ${produto.imagens}"
						             class="mb-2">

						            <input type="text"
						                   name="imagens"
						                   class="form-control"
						                   th:value="${imagem}"
						                   readonly>

						        </div>

						    </div>

						    <div th:if="${produto.imagens == null or produto.imagens.isEmpty()}"
						         class="text-muted">

						        Nenhuma imagem adicional cadastrada.

						    </div>

						</div>

						<!-- NOVAS IMAGENS ADICIONAIS -->
						<div class="mb-3">

						    <label class="form-label">
						        Adicionar novas imagens
						    </label>

						    <input type="file"
						           name="imagensAdicionaisArquivos"
						           class="form-control"
						           accept="image/*"
						           multiple>

						    <div class="form-text">
						        Você pode selecionar várias imagens ao mesmo tempo.
						    </div>

						</div>

                        <!-- ATIVO -->
                        <div class="form-check mb-4 mt-4">

                            <input type="checkbox"
                                   th:field="*{ativo}"
                                   class="form-check-input">

                            <label class="form-check-label">
                                Produto ativo
                            </label>

                        </div>


                        <!-- BOTÕES -->
                        <div class="d-flex justify-content-between">

                            <a href="/admin/produtos"
                               class="btn btn-secondary">
                                Voltar
                            </a>

                            <button type="submit"
                                    class="btn btn-success">
                                Salvar
                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
